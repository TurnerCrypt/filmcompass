services:
  - type: web
    name: filmcompass
    runtime: node
    plan: free
    branch: main
    buildCommand: node --check server.mjs && node --check dist/app.js
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.13.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: OMDB_API_KEY
        sync: false
